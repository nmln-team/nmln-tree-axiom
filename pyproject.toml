[tool.poetry]
name = "nmln"
version = "0.0.0"
description = "NMLN"
authors = ["NMLN-TEAM"]

[[tool.poetry.source]]
name = "pypi_"
url = "https://pypi.org/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[[tool.poetry.source]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.4.0+cu118.html"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.10.0"
smart-open = "^7"
pandas = "^2"
nltk = "^3.6"
matplotlib = "^3.4"
scikit-learn = "^1"
mlflow = "^2.22"
typer = "^0.12"
boto3 = "^1.20"
tqdm = "^4.62"
jupyterlab = "^4"
ipywidgets = "^8"
codetiming = "^1.3"
papermill = "^2.3"
streamlit = "^1.9"
tensorboard = "^2.9"
black = "^24"
pytest = "^8"
traitlets = "^5"
problog = "^2.2.2"
rdkit-pypi = "^2022.3.3"
icecream = "^2.1.2"
seaborn = "^0.13.0"
pyswip = "==0.2.9" # 0.2.10 has bug that causes skipBond inference to fail.
networkx = "^3"
protobuf = "3.20.0"
torchmetrics = "^1"
joblib = "^1.4.2"
latex = "^0.7.0"
chemspipy = "^2.0.0"
pyyaml = "^6.0.2"
imageio = "^2.35.1"
scipy = "^1.14.1"
wandb = "^0.18.0"
hydra-core = "^1.3.2"
pytorch_lightning = "^2"
ipdb = "^0.13.13"
pdbpp = "^0.10.3"
overrides = "^7.7.0"
pygsp = "^0.5.1"
pyemd = "^1.0.0"
torch = { version = "^2", source = "pytorch" }
torchvision = { version = "^0.19", source = "pytorch" }
torchaudio = { version = "^2", source = "pytorch" }
torch-scatter = { version = "^2", source = "pyg" }
torch-sparse = { version = "^0.6", source = "pyg" }
torch-cluster = { version = "^1.6", source = "pyg" }
torch-spline-conv = { version = "^1.2", source = "pyg" }
pyg-lib = { version = "^0.4", source = "pyg" }
torch_geometric = "^2"
dagshub = "^0.5.9"
numba = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
